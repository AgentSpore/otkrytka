<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Content-Security-Policy (buildless-safe). Restricts where scripts/styles/
       images may come from so a compromised third-party host cannot inject code
       that reads the organizer token from localStorage.
       Loosened directives (each required by this buildless SPA, noted here):
         script-src 'unsafe-eval'   — the Tailwind Play CDN (cdn.tailwindcss.com)
                                       compiles utility classes at runtime via
                                       Function(); it will not run without it.
         script-src 'unsafe-inline' — the per-board <script> that GET /c/{slug}
                                       injects to expose window.__CANONICAL__ has
                                       variable content (no stable hash/nonce is
                                       available in a buildless deploy), and the
                                       inline tailwind.config block above.
         style-src  'unsafe-inline' — Tailwind injects a runtime <style> and the
                                       SPA uses inline style="" attributes.
       RESIDUAL RISK: cdn.tailwindcss.com is UNVERSIONED, so it cannot carry an
       integrity= hash — a compromised Tailwind CDN could still run script. This
       is accepted for the buildless model; self-hosting Tailwind (a build step)
       is the only full fix and is out of scope here. The two versioned libraries
       (confetti, qrcode) are now vendored + served same-origin from /vendor, so
       jsDelivr is dropped from script-src entirely.
       NOTE: this CSP restricts the ORIGIN of remote scripts only. With
       script-src 'unsafe-inline' it does NOT mitigate DOM-XSS from injected
       inline markup; the app's defense against that stays esc() on every
       user-controlled value at render time. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'self'; form-action 'self'">
  <title>Открытка · Тёплые слова вскладчину</title>
  <meta name="description" content="Соберите тёплые слова и фото для того, кто дорог. Одна ссылка, без регистрации.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E">
  <!-- Social share unfurl (Open Graph + Twitter). The block between the OG
       markers is swapped per-board by GET /c/{slug}; keep the markers intact. -->
  <!--OG--><meta property="og:type" content="website">
  <meta property="og:site_name" content="Открытка">
  <meta property="og:title" content="Открытка вскладчину">
  <meta property="og:description" content="Соберите тёплые слова и фото для того, кто дорог. Одна ссылка, без регистрации.">
  <meta property="og:url" content="https://otkrytka.agentspore.com">
  <meta property="og:image" content="https://otkrytka.agentspore.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Открытка вскладчину">
  <meta name="twitter:description" content="Соберите тёплые слова и фото для того, кто дорог. Одна ссылка, без регистрации.">
  <meta name="twitter:image" content="https://otkrytka.agentspore.com/og-image.png"><!--/OG-->
  <!-- Runtime signal: GET /c/{slug} and /embed/{slug} swap this for a tiny script
       exposing the canonical origin (+ the read-only EMBED flag on /embed). Empty
       by default so the static landing carries no injected script. -->
  <!--SIG--><!--/SIG-->
  <!-- Google Fonts: Fraunces (display serif) + Quicksand (rounded body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CDN with festive-gift OKLCH config. The CDN script MUST load
       BEFORE the inline tailwind.config below: the config assigns to the global
       `tailwind` object that the CDN script defines, so running it first threw
       `ReferenceError: tailwind is not defined`. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream:       'oklch(98% 0.018 75)',
            sand:        'oklch(95% 0.028 50)',
            'sand-deep': 'oklch(88% 0.040 40)',
            coral:       'oklch(54% 0.190 8)',
            'coral-dark':'oklch(48% 0.180 8)',
            teal:        'oklch(70% 0.110 165)',
            amber:       'oklch(78% 0.130 82)',
            gold:        'oklch(49% 0.090 75)',
            plum:        'oklch(60% 0.120 305)',
            ink:         'oklch(25% 0.035 25)',
            muted:       'oklch(52% 0.035 35)',
            surface:     'oklch(99% 0.012 85)',
          },
          borderRadius: { '2xl': '20px', '3xl': '28px', '4xl': '32px' },
          fontFamily: {
            display: ['Fraunces', 'Georgia', 'serif'],
            body:    ['Quicksand', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="/styles.css" rel="stylesheet">
</head>
<body class="font-body bg-cream text-ink min-h-screen">
  <div id="app"></div>
  <!-- Vendored, version-pinned libraries served from our own origin
       (frontend/vendor/, mounted at /vendor). canvas-confetti@1.9.3 and
       qrcodejs@1.0.0 — self-hosting removes the jsDelivr dependency entirely, so
       no third-party script origin can serve code into this page. Because they
       are same-origin now, integrity=/crossorigin= are no longer needed. -->
  <script src="/vendor/confetti.browser.min.js"></script>
  <script src="/vendor/qrcode.min.js"></script>
  <script src="/app.js" defer></script>
</body>
</html>
