[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otkrytka"
version = "0.1.0"
description = "Collaborative group greeting card — one link, everyone adds a wish, no signup."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.137",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "aiosqlite>=0.20",
    "loguru>=0.7",
    "python-multipart>=0.0.9",
    "Pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/otkrytka"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
