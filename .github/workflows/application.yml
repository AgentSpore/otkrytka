name: Application regression

on:
  pull_request:
    paths:
      - src/**
      - tests/**
      - frontend/**
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - .github/workflows/application.yml
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - frontend/**
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - .github/workflows/application.yml

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.20"
          enable-cache: false
      - name: Run application tests
        run: uv run --python 3.11 --locked --extra dev pytest
